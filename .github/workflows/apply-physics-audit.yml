name: Apply verified physics audit
on:
  push:
    branches: ['fix/physics-audit-2026-09-19']
    paths: ['.github/workflows/apply-physics-audit.yml']
permissions:
  contents: read
jobs:
  apply-audit:
    if: github.repository == 'jsk1004ha/dronefire'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/physics-audit-2026-09-19
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact patch and apply
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          parts = [pathlib.Path(f'.audit-transfer/part{i}.b64').read_text().strip() for i in range(1, 5)]
          patch = zlib.decompress(base64.b64decode(''.join(parts), validate=True))
          expected = 'e28d10ca57b7806c601459e1c0c6a3c2f98ec2a96494c93a09710139ef62725a'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch checksum mismatch; no changes applied'
          pathlib.Path('/tmp/physics-audit.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/physics-audit.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/physics-audit.patch'], check=True)
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify all regression tests and syntax
        shell: bash
        run: |
          set -o pipefail
          python -X utf8 -m unittest discover -s tests -v 2>&1 | tee audit-tests.log
          node --check web/app.js
          git diff --check
      - name: Commit only the audited source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/drone_derivation.md docs/physics_audit_2026-09-19.md docs/transport_derivation.md firelab/drone.py firelab/drone_study.py firelab/physics.py firelab/reactive.py tests/test_physics_audit.py tests/test_reactive.py
          git commit -m 'fix: conserve launch power, mass and recoil; align native source ramps and ledgers'
          git push origin HEAD:fix/physics-audit-2026-09-19
          git rev-parse HEAD | tee audited-commit.txt
          git archive --format=zip --output=audited-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: applied-physics-audit-evidence
          path: |
            audit-tests.log
            audited-commit.txt
            audited-source.zip
          retention-days: 7
