name: Physics regression tests

on:
  push:
    branches: [main, 'fix/physics-audit-2026-09-19']
  pull_request:

permissions:
  contents: read

jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and numerical regression tests
        shell: bash
        run: |
          set -o pipefail
          python -X utf8 -m unittest discover -s tests -v 2>&1 | tee unittest.log
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Snapshot tested source
        if: always()
        run: git archive --format=zip --output=tested-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-regression-evidence
          path: |
            unittest.log
            tested-source.zip
          retention-days: 7
